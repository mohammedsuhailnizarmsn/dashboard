<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secure access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f8;--panel:#fff;--ink:#141a22;--muted:#5d6877;--line:#dde2e8;--accent:#0b7f86;--accent-ink:#fff;--warn:#b4560a}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f141a;--panel:#171e27;--ink:#e8edf3;--muted:#93a0b0;--line:#2a3441;--accent:#3fc1c9;--accent-ink:#06282b;--warn:#f0a35e}}
:root[data-theme=dark]{--bg:#0f141a;--panel:#171e27;--ink:#e8edf3;--muted:#93a0b0;--line:#2a3441;--accent:#3fc1c9;--accent-ink:#06282b;--warn:#f0a35e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Schibsted Grotesk",system-ui,sans-serif}
#loginScreen{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#eaf8f9 0%,var(--bg) 42%,#e9eef3 100%)}
.login-card{width:min(100%,420px);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:0 18px 40px rgba(11,127,134,.09)}
.login-card h1{margin:0 0 8px;font-size:28px;letter-spacing:-.02em}
.login-card form{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.login-card label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.login-card input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--ink)}
.login-card .btn{width:100%;padding:10px 14px}
#loginError{min-height:20px;margin:0;color:var(--warn);font-size:13px}
.sub{color:var(--muted);font-size:13px}
button,input{font:inherit;color:inherit}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:500}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
  <div id="loginScreen">
    <div class="login-card">
      <h1>Secure access</h1>
      <div class="sub">This dashboard is protected. Enter the password to continue.</div>
      <form id="loginForm" novalidate>
        <label>Password
          <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Enter password" required>
        </label>
        <button class="btn" type="submit">Log in</button>
        <p id="loginError" role="alert" aria-live="polite"></p>
      </form>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
